# ===================================================================
# SindaAgro Backend - Main Application Properties
# ===================================================================
spring.application.name=sindaagro-backend
server.port=8080

# -------------------------------------------------------------------
# Datasource Configuration (MySQL 8.0 - sindaagro_db)
# Uses environment variables with safe default fallbacks
# -------------------------------------------------------------------
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3308/sindaagro_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# -------------------------------------------------------------------
# JPA / Hibernate Settings
# -------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# -------------------------------------------------------------------
# JWT Security Configuration
# Secret key must be at least 256 bits (32 characters) for HMAC-SHA256
# -------------------------------------------------------------------
app.jwt.secret=${JWT_SECRET:SindaAgroSecretKeyForJWTTokenGeneration2026ProductionGradedSecurity256Bit}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Include active local profiles if present
spring.config.import=optional:file:./src/main/resources/application-local.properties

# ===================================================================
# Spring Boot Test Environment Properties
# Uses H2 In-Memory Database for fast, isolated unit & integration testing
# ===================================================================

spring.datasource.url=jdbc:h2:mem:agrivision_test_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

app.jwt.secret=TestAgriVisionAISecretKeyForJWTTokenGeneration2026ProductionGradedSecurity256Bit
app.jwt.expiration-ms=3600000
